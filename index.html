<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Nexora</title>
</head>
<body>
    <div class="navigation-bar">
        <div class="logo">
            <img src="./assets/logo.jpg" alt="logo">
            <h4>Nexora</h4>
        </div>

        <nav class="navigation">
            <a class="nav-bar" href="#">Home</a>
            <a class="nav-bar" href="#">About</a>
            <a class="nav-bar" href="#">Services</a>
            <a class="nav-bar" href="#">Portfolio</a>
            <a class="nav-bar" href="#">Pricing</a>
            <a class="nav-bar" href="#">Contact</a>
        </nav>

        <button class="btn" type="button">Get started</button>
    </div>
    <main class="hero-section">
        <div class="section-1">
            <p class="p-wel">Welcome to Nexora</p>
            <h1 class="h-dis">We Build Digital <span class="span-dis">Experiences</span></h1>
            <p class="p-dis">We're a creative agency that helps brands grow through beautiful design and powerful technology</p>
            <div class="btn-container">
                <button class="btn-explore" type="button">Explore Services</button>
                <button class="btn-watch" type="button">Watch video</button>
            </div>
        </div>
        <div class="section-2">
            <img class="img-stats" src="./assets/statistics.jpg" alt="statistics">
